services:
  maestro:
    build: .
    container_name: maestro
    restart: unless-stopped
    ports:
      - "8222:8222"
    env_file:
      - ../config/.env
    volumes:
      - ../config/ssh:/mnt/ssh:ro
      - ../config/hosts.yaml:/app/hosts.yaml:ro
      - ../state:/root/.maestro
      - /home/rmstxrx/Development:/home/rmstxrx/Development
      - /tmp/maestro:/tmp/maestro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8222/.well-known/oauth-authorization-server')"]
      interval: 15s
      timeout: 5s
